name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:

jobs:
  initial_checks:
    # Mandatory checks before CI tests
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1 # v3.2.1
    with:
      coverage: false
      envs: |
        # Code style
        - linux: codestyle

  tests:
    needs: initial_checks
    permissions:
      contents: read
      id-token: write
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1 # v3.2.1
    with:
      coverage: codecov-oidc
      libraries: |
        apt:
          - libhdf5-dev

      envs: |
        - linux: py310-test-bqplot012
        - linux: py311-test
        - linux: py312-test
        - linux: py313-test

        # test against the oldest supported versions of direct dependencies
        - linux: py310-test-oldestdeps

        - macos: py310-test
        - macos: py311-test-bqplot012
        - macos: py313-test
        - macos: py314-test

        - windows: py310-test
        - windows: py311-test
        - windows: py312-test-bqplot012
        - windows: py314-test

        # test against some dev versions of some packages
        - linux: py314-test-dev
        - macos: py312-test-dev
        - windows: py313-test-dev

  no_coverage:
    needs: initial_checks
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1 # v3.2.1
    with:
      coverage: false
      pytest: false

      envs: |
        - windows: py310-notebooks
        - macos: py314-notebooks
        - linux: py313-notebooks

        - linux: py314-docs
        - macos: py310-docs
        - windows: py312-docs

  binder-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build binder Docker image
        run: docker build -t glue-jupyter-binder -f binder/Dockerfile .

      - name: Test notebook execution
        run: |
          docker run --rm glue-jupyter-binder \
            jupyter nbconvert --to notebook --execute \
              notebooks/Generic/demo_gaussian.ipynb \
              --output /tmp/output.ipynb

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install ".[visualtest]" \
            "solara[pytest]==1.61.0" \
            "jupyterlab<4"
      - name: Install playwright
        run: |
          playwright install chromium
      - name: Run visual regression tests
        run: |
          pytest glue_jupyter/tests/ui
      - name: Upload UI Test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glue-jupyter-ui-test-output
          path: |
            test-results

  build:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1 # v3.2.1
    with:
      python-version: '3.14'
      libraries: libhdf5-dev
      test_extras: test
      test_command: pytest --pyargs glue_jupyter -m 'not notebook'
      save_artifacts: true
      upload_to_pypi: false

  upload:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Upload built artifacts to PyPI
    runs-on: ubuntu-latest
    needs:
      - tests
      - build
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist

      - name: Run upload
        uses: pypa/gh-action-pypi-publish@release/v1
