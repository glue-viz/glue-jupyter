[tox]
envlist =
    py{310,311,312,313,314}-{test,notebooks,docs,dev}{-bqplot012}
    py310-test-oldestdeps
    py311-test-visual
    py311-test-visual-dev
requires =
    pip >= 18.0
    setuptools >= 30.3.0
    tox-uv >= 1.35

[testenv]
passenv =
    DISPLAY
    HOME
setenv =
    JUPYTER_PLATFORM_DIRS=1
    HOST=0.0.0.0
    # Tests run from changedir (.tmp/{envname}), so point coverage at the
    # config explicitly - otherwise it can't find pyproject.toml and the
    # omit settings (which exclude test files) are silently ignored.
    test: COVERAGE_RCFILE={toxinidir}/pyproject.toml
    COVERAGE_FILE={toxinidir}/.coverage
    bqplot012: PIP_CONSTRAINT={toxinidir}/.constraints-bqplot012.txt
    bqplot012: UV_CONSTRAINT={toxinidir}/.constraints-bqplot012.txt
    # With the oldest dependencies, let warnings be warnings rather than errors
    # so that we don't need to filter deprecations from old/new combinations
    oldestdeps: PYTEST_ADDOPTS=-Wdefault
whitelist_externals =
    find
    rm
    sed
    make
changedir =
    test: .tmp/{envname}
    docs: docs
deps =
    dev: git+https://github.com/glue-viz/glue
    visual-dev: git+https://github.com/glue-viz/bqplot-image-gl
extras =
    test: test
    notebooks: test
    notebooks: nbtest
    docs: docs
    visual: visualtest
# The oldestdeps factor installs the oldest versions of the direct
# dependencies allowed by the lower bounds in pyproject.toml, to check
# that those lower bounds are actually correct.
uv_resolution =
    oldestdeps: lowest-direct
# Seed pip into the environments so that 'pip freeze' keeps working
uv_seed = true
commands =
    test: pip freeze
    test-!visual: pytest --pyargs glue_jupyter --cov glue_jupyter {posargs}
    test-visual: playwright install chromium
    test-visual: pytest --show-capture=no --pyargs glue_jupyter {posargs} --mpl -m mpl_image_compare --mpl --mpl-generate-summary=html --mpl-results-path={toxinidir}/results --mpl-hash-library={toxinidir}/glue_jupyter/tests/images/{envname}.json --mpl-baseline-path=https://raw.githubusercontent.com/glue-viz/glue-jupyter-visual-tests/main/images/{envname}/
    notebooks: python .validate-notebooks.py
    notebooks: pytest --pyargs glue_jupyter -m notebook {posargs}
    docs: sphinx-build -W -n -b html -d _build/doctrees   . _build/html

[testenv:codestyle]
skipsdist = true
skip_install = true
description = Run all style and file checks with pre-commit
deps =
    pre-commit
commands =
    pre-commit install-hooks
    pre-commit run --color always --all-files --show-diff-on-failure
